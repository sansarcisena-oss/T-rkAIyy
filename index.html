
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b12">
  <title>TürkAI Next</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b12;
      --panel: #111522;
      --panel2: #171c2b;
      --line: #282e42;
      --text: #f1f3ff;
      --muted: #9ba4bc;
      --accent: #8b72ff;
      --accent2: #5d9bff;
      --danger: #ff7b86;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -20%, #332466 0, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    button, textarea, select, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      max-width: 1050px;
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-size: 23px;
      font-weight: 900;
      box-shadow: 0 6px 30px #7864ff44;
    }

    h1 { font-size: 19px; margin: 0; }
    .subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #f3b95f;
      border-radius: 50%;
    }

    .dot.online { background: #5fe0a0; }
    .dot.error { background: var(--danger); }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding: 16px 0;
    }

    select, .secondary {
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px 12px;
    }

    .secondary:hover { border-color: var(--accent); }

    .endpoint {
      display: flex;
      flex: 1;
      min-width: 220px;
      gap: 6px;
    }

    .endpoint input {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
    }

    .endpoint input:focus, textarea:focus {
      border-color: var(--accent);
    }

    main {
      flex: 1;
      min-height: 350px;
      padding: 22px 0;
    }

    .welcome {
      min-height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .welcome-symbol {
      font-size: 42px;
      margin-bottom: 6px;
    }

    .welcome h2 {
      font-size: clamp(24px, 5vw, 35px);
      margin: 0;
      letter-spacing: -1px;
    }

    .gradient {
      background: linear-gradient(90deg, #b7a7ff, #78bdff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome p {
      max-width: 480px;
      color: var(--muted);
      line-height: 1.7;
      margin: 0;
    }

    .suggestions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 12px;
    }

    .suggestion {
      background: #121726;
      color: #d7dafa;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 13px;
      text-align: left;
    }

    .suggestion:hover { border-color: var(--accent); }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: appear .2s ease-out;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--panel2);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 800;
    }

    .message.assistant .avatar {
      background: linear-gradient(135deg, #7257d9, #397ac8);
    }

    .bubble { min-width: 0; flex: 1; }
    .who { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }

    .content {
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .content pre {
      overflow-x: auto;
      padding: 13px;
      background: #080a10;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .error-text { color: var(--danger); }

    .composer {
      position: sticky;
      bottom: 0;
      padding: 12px 0 4px;
      background: linear-gradient(transparent, var(--bg) 18%);
    }

    .inputbox {
      border: 1px solid #343b53;
      background: #111522;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 10px 40px #0003;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 55px;
      max-height: 180px;
      resize: vertical;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;
      padding: 7px;
      line-height: 1.6;
    }

    .input-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 8px;
    }

    .hint { font-size: 11px; color: var(--muted); }

    .primary {
      border: 0;
      border-radius: 11px;
      padding: 10px 16px;
      background: linear-gradient(135deg, var(--accent), #5f82f5);
      color: white;
      font-weight: 700;
    }

    .primary:disabled { opacity: .5; cursor: not-allowed; }

    footer {
      text-align: center;
      color: #737d96;
      font-size: 11px;
      padding: 17px 0 5px;
    }

    .typing { color: var(--muted); font-size: 13px; }

    @media (max-width: 600px) {
      .app { padding: 12px; }
      header { padding-bottom: 15px; }
      .endpoint { order: 2; flex-basis: 100%; }
      .toolbar { gap: 8px; }
      #modelSelect { flex: 1; min-width: 0; }
      main { padding-top: 10px; }
      .welcome { min-height: 300px; }
      .hint { max-width: 190px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">T</div>
      <div>
        <h1>TürkAI <span class="gradient">Next</span></h1>
        <div class="subtitle">Akıllı model platformu</div>
      </div>
    </div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Bağlantı kontrol edilmedi</span>
    </div>
  </header>

  <section class="toolbar">
    <select id="modelSelect" aria-label="Model seç">
      <option value="deepseek">DeepSeek V4.1 Flash</option>
      <option value="diffusiongemma">Google DiffusionGemma</option>
    </select>

    <div class="endpoint">
      <input id="serverUrl" type="url"
        placeholder="https://servis-adin.onrender.com"
        aria-label="Sunucu adresi">
      <button class="secondary" id="connectBtn">Bağlan</button>
    </div>

    <button class="secondary" id="newChatBtn">Yeni sohbet</button>
  </section>

  <main>
    <section class="welcome" id="welcome">
      <div class="welcome-symbol">✦</div>
      <h2>Ne üzerinde <span class="gradient">çalışalım?</span></h2>
      <p>Sorunu yaz, fikir geliştir, kod oluştur veya bir konuyu adım adım öğren.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Bana modern bir web uygulaması fikri ver.">Bir proje fikri bul</button>
        <button class="suggestion" data-prompt="JavaScript'i örneklerle öğret.">Kod öğren</button>
        <button class="suggestion" data-prompt="Yapay zekânın nasıl çalıştığını anlat.">Yapay zekâyı keşfet</button>
      </div>
    </section>
    <section id="messages" aria-live="polite"></section>
  </main>

  <section class="composer">
    <div class="inputbox">
      <textarea id="messageInput" maxlength="20000"
        placeholder="TürkAI Next'e bir şey sor..."
        aria-label="Mesajın"></textarea>
      <div class="input-actions">
        <span class="hint">Enter gönderir · Shift + Enter yeni satır</span>
        <button class="primary" id="sendBtn">Gönder ↑</button>
      </div>
    </div>
  </section>

  <footer>
    TürkAI Next · API anahtarları tarayıcıya değil, sunucuya aittir.
  </footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const serverUrl = $("serverUrl");
  const modelSelect = $("modelSelect");
  const messageInput = $("messageInput");
  const messagesEl = $("messages");
  const welcome = $("welcome");
  const sendBtn = $("sendBtn");
  const statusDot = $("statusDot");
  const statusText = $("statusText");

  let history = [];
  let busy = false;

  // Sunucu adresini gir: ör. https://turkai-next.onrender.com
  function baseUrl() {
    return serverUrl.value.trim().replace(/\/+$/, "");
  }

  function setStatus(text, type = "") {
    statusText.textContent = text;
    statusDot.className = "dot" + (type ? " " + type : "");
  }

  function addMessage(role, text, error = false) {
    welcome.hidden = true;

    const row = document.createElement("article");
    row.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "S" : "T";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "Sen" : "TürkAI Next";

    const content = document.createElement("div");
    content.className = "content" + (error ? " error-text" : "");
    content.textContent = text;

    bubble.append(who, content);
    row.append(avatar, bubble);
    messagesEl.append(row);

    row.scrollIntoView({ behavior: "smooth", block: "end" });
    return { row, content };
  }

  async function connect() {
    if (!baseUrl()) {
      setStatus("Sunucu adresini gir", "error");
      return;
    }

    setStatus("Bağlanıyor...");

    try {
      const response = await fetch(baseUrl() + "/health");
      if (!response.ok) throw new Error("Sunucu yanıt vermedi");

      const data = await response.json();
      setStatus(data.apiConfigured ? "Sunucu bağlı" : "API anahtarı eksik",
        data.apiConfigured ? "online" : "error");
    } catch {
      setStatus("Bağlantı kurulamadı", "error");
    }
  }

  async function sendMessage(prefill) {
    if (busy) return;

    const message = (prefill ?? messageInput.value).trim();
    if (!message) return;

    if (!baseUrl()) {
      setStatus("Önce Render sunucu adresini gir", "error");
      return;
    }

    busy = true;
    sendBtn.disabled = true;
    messageInput.value = "";

    addMessage("user", message);

    const typing = addMessage("assistant", "Yanıt hazırlanıyor...");
    typing.content.className = "content typing";

    try {
      const response = await fetch(baseUrl() + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: modelSelect.value,
          message,
          history: history.slice(-20)
        })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "Sunucu hatası: " + response.status);
      }

      const reply = typeof data.reply === "string"
        ? data.reply
        : "Model boş yanıt döndürdü.";

      typing.content.className = "content";
      typing.content.textContent = reply;

      history.push(
        { role: "user", content: message },
        { role: "assistant", content: reply }
      );
      history = history.slice(-20);

      setStatus("Yanıt alındı", "online");
    } catch (error) {
      typing.content.className = "content error-text";
      typing.content.textContent =
        "Yanıt alınamadı: " + error.message +
        "\n\nSunucu adresini, Render dağıtımını ve API ayarlarını kontrol et.";
      setStatus("İstek başarısız", "error");
    } finally {
      busy = false;
      sendBtn.disabled = false;
      messageInput.focus();
    }
  }

  $("connectBtn").addEventListener("click", connect);
  sendBtn.addEventListener("click", () => sendMessage());

  messageInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  $("newChatBtn").addEventListener("click", () => {
    if (busy) return;
    history = [];
    messagesEl.replaceChildren();
    welcome.hidden = false;
    setStatus("Yeni sohbet hazır");
    messageInput.focus();
  });

  document.querySelectorAll("[data-prompt]").forEach(button => {
    button.addEventListener("click", () => {
      messageInput.value = button.dataset.prompt;
      sendMessage();
    });
  });

  // Sunucu adresini bu cihazda saklamaz; sayfa yenilenince tekrar gir.
  setStatus("Render adresini bekliyor");
})();
</script>
</body>
</html>
